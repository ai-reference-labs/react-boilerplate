apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "journey-hub.fullname" . }}
  labels:
    {{- include "journey-hub.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "journey-hub.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
